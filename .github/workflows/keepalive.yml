# Weekly keep-alive so the free Supabase project never auto-pauses.
# Free-tier Supabase projects pause after ~7 days of inactivity; a paused
# project makes Cloud Sync fail with "Failed to fetch". This workflow runs a
# tiny authenticated query every few days to keep the project active.
#
# One-time setup (after this repo is on GitHub):
#   Repo  →  Settings  →  Secrets and variables  →  Actions  →  New repository secret
#     SUPABASE_URL        =  https://<your-project-ref>.supabase.co
#     SUPABASE_ANON_KEY   =  <your anon public key>
name: supabase-keepalive

on:
  schedule:
    - cron: '0 6 * * 1,4'   # 06:00 UTC every Monday and Thursday
  workflow_dispatch:          # allow manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ] || [ -z "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            echo "SUPABASE_URL / SUPABASE_ANON_KEY secrets are not set — skipping."
            exit 0
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/astro_sync?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "Supabase responded with HTTP $code"
          if [ "$code" -ge 500 ]; then echo "Unexpected server error"; exit 1; fi
